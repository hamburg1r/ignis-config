[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ignis-desktop"
version = "0.1.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desktop = [
    "style.scss",
    "scss/general.scss",
    "scss/osd.scss",
    "scss/search.scss",
]

[tool.basedpyright]
executionEnvironments = [
  { root = "src" }
]